<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Interactivo: La Aventura de Bri y Kitty</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --player-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .video-player-container {
            width: 100%;
            max-width: 900px;
            background: var(--player-bg);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #334155;
        }

        .screen-frame {
            position: relative;
            width: 100%;
            height: 480px;
            background-color: #000;
            overflow: hidden;
        }

        .screen-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        .screen-frame img.fade-out {
            opacity: 0;
        }

        .video-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .video-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .live-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .interactive-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.75) 70%, rgba(15, 23, 42, 0) 100%);
            padding: 30px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .story-dialogue {
            font-size: 1.05rem;
            line-height: 1.5;
            margin: 0;
            color: #e2e8f0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .choices-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid var(--accent-color);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            backdrop-filter: blur(5px);
            font-weight: 500;
        }

        .choice-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
            transform: scale(1.01);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .restart-btn {
            background: rgba(34, 197, 94, 0.25);
            border-color: #22c55e;
        }
        .restart-btn:hover {
            background: #22c55e;
            color: #fff;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }

        .player-controls {
            background-color: #0f172a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background: #334155;
            margin: 0 20px;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            width: 25%;
            height: 100%;
            background: var(--accent-color);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="video-player-container">
        <div class="screen-frame">
            <div class="video-header">
                <h2 id="video-title">Capítulo 1: El Bosque de Tulipanes Azules</h2>
                <span class="live-badge">Interactivo</span>
            </div>

            <img id="video-screen" src="" alt="Fotograma de la historia">

            <div class="interactive-overlay">
                <p id="video-dialogue" class="story-dialogue">Cargando escena...</p>
                <div id="choices-box" class="choices-box"></div>
            </div>
        </div>

        <div class="player-controls">
            <span id="scene-counter">Escena 1 de 4</span>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 25%;"></div>
            </div>
            <span>HD • Interactivo</span>
        </div>
    </div>

    <script>
        const videoData = {
            inicio: {
                title: "Capítulo 1: El Bosque de Tulipanes Azules",
                dialogue: "Bri camina sonriendo por el sendero del bosque mágico con su cabello lacio, lentes modernos, su chaqueta de cuero y su gata Kitty al lado. Un pergamino brillante aparece.",
                image: "https://i.ibb.co/6R2L902D/cap1.jpg", 
                progress: "25%",
                counter: "Escena 1 de 4",
                choices: [
                    { text: "▶ Reproducir siguiente pista (Abrir pergamino)", next: "santuario" }
                ]
            },
            santuario: {
                title: "Capítulo 2: El Enigma del Santuario",
                dialogue: "Llegan frente al antiguo arco de piedra con runas brillantes. La puerta gigante exige una elección y Kitty mira fijamente a Bri.",
                image: "https://i.ibb.co/7d9N6c28/cap2.jpg",
                progress: "50%",
                counter: "Escena 2 de 4",
                choices: [
                    { text: "⚡ Opción A: Colocar tulipanes azules reales en los huecos", next: "postre" },
                    { text: "⚡ Opción B: Pedirle a Kitty que active la runa secreta", next: "postre" }
                ]
            },
            postre: {
                title: "Capítulo 3: El Claro del Postre Mágico",
                dialogue: "¡La puerta se abre! Sobre un altar de piedra iluminado descansa el brillante cheesecake de maracuyá fresco. Bri lo señala emocionada.",
                image: "https://i.ibb.co/3ykd1x6L/cap3.jpg",
                progress: "75%",
                counter: "Escena 3 de 4",
                choices: [
                    { text: "▶ Compartir con Kitty y avanzar hacia la costa", next: "playa" }
                ]
            },
            playa: {
                title: "Capítulo 4: El Atardecer en la Playa",
                dialogue: "El viaje concluye frente al mar al atardecer. Bri descansa en la arena con Kitty en su regazo. ¡Gracias por hacer cada día una aventura mágica!",
                image: "https://i.ibb.co/7x5q573d/cap4.jpg",
                progress: "100%",
                counter: "Escena 4 de 4",
                choices: [
                    { text: "↺ Volver a reproducir la aventura desde el inicio", next: "inicio", isRestart: true }
                ]
            }
        };

        function loadScene(sceneKey) {
            const scene = videoData[sceneKey];
            const imgElement = document.getElementById("video-screen");

            imgElement.classList.add("fade-out");

            setTimeout(() => {
                document.getElementById("video-title").innerText = scene.title;
                document.getElementById("video-dialogue").innerText = scene.dialogue;
                imgElement.src = scene.image;
                document.getElementById("progress-fill").style.width = scene.progress;
                document.getElementById("scene-counter").innerText = scene.counter;

                const choicesBox = document.getElementById("choices-box");
                choicesBox.innerHTML = "";

                scene.choices.forEach(choice => {
                    const button = document.createElement("button");
                    button.className = "choice-btn";
                    if(choice.isRestart) button.classList.add("restart-btn");
                    button.innerText = choice.text;
                    button.onclick = () => loadScene(choice.next);
                    choicesBox.appendChild(button);
                });

                imgElement.classList.remove("fade-out");
            }, 300);
        }

        loadScene("inicio");
    </script>
</body>
</html>
