<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bri & Kitty - Bosque de Tulipanes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Vídeo en bucle como fondo interactivo */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }

        /* Barra Superior */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .game-title {
            background: rgba(0, 0, 0, 0.75);
            color: #f3e5ab;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            border: 1px solid rgba(243, 229, 171, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .location {
            font-size: 0.75rem;
            color: #d1d1d1;
            margin-top: 2px;
            text-shadow: 1px 1px 2px #000;
        }

        .top-buttons {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(243, 229, 171, 0.4);
            color: #f3e5ab;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        /* Área Inferior optimizada para móviles */
        .bottom-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            z-index: 10;
            margin-bottom: 5px;
        }

        .stats-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(243, 229, 171, 0.3);
            width: 130px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 0.8rem;
        }

        .progress-bar {
            flex-grow: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #f3e5ab;
            width: 50%;
            transition: width 0.3s ease;
        }

        .main-ui-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 8px;
            width: 100%;
        }

        /* Caja de Diálogo */
        .dialogue-box {
            background: rgba(20, 18, 15, 0.92);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 10px;
            flex-grow: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .speaker-name {
            color: #f3e5ab;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 2px;
            font-style: italic;
        }

        .dialogue-text {
            color: #f9f6ee;
            font-size: 0.85rem;
            line-height: 1.35;
        }

        /* Opciones de Elección */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 175px;
            max-width: 45%;
        }

        .choice-btn {
            background: rgba(20, 18, 15, 0.92);
            border: 1px solid #d4af37;
            color: #f3e5ab;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.8rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .choice-btn:active {
            background: rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <video class="video-background" autoplay muted loop playsinline>
        <source src="fondo_bri.mp4" type="video/mp4">
        Tu navegador no soporta vídeo interactivo.
    </video>

    <div class="game-container" id="gameScreen">
        <div class="top-bar">
            <div>
                <div class="game-title">
                    <span>Bri & Kitty 🐾</span>
                    <span style="font-size: 0.7rem; opacity: 0.8;">V3</span>
                </div>
                <div class="location" id="locationText">📍 Bosque de Tulipanes</div>
            </div>
            <div class="top-buttons">
                <button class="icon-btn" title="Pausa">⏸</button>
                <button class="icon-btn" title="Configuración">⚙</button>
                <button class="icon-btn" title="Historial">📖</button>
            </div>
        </div>

        <div class="bottom-section">
            <div class="stats-box">
                <div class="stat-row">
                    <span>🐾</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="affectionBar"></div>
                    </div>
                </div>
            </div>

            <div class="main-ui-row">
                <div class="dialogue-box">
                    <div class="speaker-name" id="speakerName">Bri</div>
                    <div class="dialogue-text" id="dialogueText">Qué lugar tan increíble, Kitty... Parece sacado de un sueño. ¿Vamos a explorar un poco?</div>
                </div>

                <div class="choices-container" id="choicesContainer">
                    <button class="choice-btn" onclick="selectChoice(1)">
                        <span>🌷</span> Seguir sendero
                    </button>
                    <button class="choice-btn" onclick="selectChoice(2)">
                        <span>⛰</span> Subir colina
                    </button>
                    <button class="choice-btn" onclick="selectChoice(3)">
                        <span>✨</span> Claro mágico
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let affection = 50;

        function updateAffection(amount) {
            affection = Math.max(0, Math.min(100, affection + amount));
            document.getElementById('affectionBar').style.width = affection + '%';
        }

        function selectChoice(option) {
            const speaker = document.getElementById('speakerName');
            const dialogue = document.getElementById('dialogueText');
            const choices = document.getElementById('choicesContainer');
            const location = document.getElementById('locationText');

            if (option === 1) {
                location.innerText = "📍 Sendero de Tulipanes";
                speaker.innerText = "Bri";
                dialogue.innerText = "¡Mira cuántos colores, Kitty! La gatita tricolor maúlla contenta y se frota contra ti.";
                updateAffection(10);
            } else if (option === 2) {
                location.innerText = "📍 Colina del Mirador";
                speaker.innerText = "Bri";
                dialogue.innerText = "Desde aquí arriba el castillo se ve majestuoso. Kitty observa con atención las torres lejanas.";
                updateAffection(5);
            } else if (option === 3) {
                location.innerText = "📍 Claro Mágico";
                speaker.innerText = "Bri";
                dialogue.innerText = "Hay un brillo mágico flotando en el aire. ¡Kitty da un pequeño salto emocionada!";
                updateAffection(15);
            }

            choices.innerHTML = `
                <button class="choice-btn" onclick="resetGame()">
                    <span>🔄</span> Volver al inicio
                </button>
            `;
        }

        function resetGame() {
            location.reload();
        }
    </script>
</body>
</html>
