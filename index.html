<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Aventura de Bri y Kitty</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #2980b9;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--primary-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .image-container {
            width: 100%;
            height: 420px;
            background-color: #e2e8f0;
            overflow: hidden;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .image-container img:hover {
            transform: scale(1.02);
        }

        .content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        h2 {
            margin: 0;
            font-size: 1.7rem;
            color: #1b4f72;
            border-bottom: 2px solid #ebf5fb;
            padding-bottom: 10px;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.7;
            margin: 0;
            color: #4a5568;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s, box-shadow 0.2s;
            text-align: left;
            box-shadow: 0 4px 10px rgba(41, 128, 185, 0.2);
        }

        button:hover {
            background-color: #1f618d;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(41, 128, 185, 0.3);
        }

        .restart-btn {
            background-color: #27ae60;
            text-align: center;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.2);
        }
        .restart-btn:hover {
            background-color: #219653;
            box-shadow: 0 6px 15px rgba(39, 174, 96, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-container">
            <img id="story-image" src="" alt="Escena de la historia">
        </div>
        <div class="content">
            <h2 id="story-title">Título del Capítulo</h2>
            <p id="story-text">Texto de la historia...</p>
            <div id="choices-container" class="choices">
                </div>
        </div>
    </div>

    <script>
        const storyData = {
            inicio: {
                title: "Capítulo 1: El Bosque de Tulipanes Azules",
                text: "Bri, con su cabello lacio, lentes modernos, su chaqueta de cuero y su gata tricolor Kitty a su lado, camina sonriendo por un sendero mágico flanqueado por tulipanes azules y blancos. Un pergamino brillante aguarda al final.",
                image: "https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1200&q=80",
                choices: [
                    { text: "Abrir el pergamino para continuar la aventura", next: "santuario" }
                ]
            },
            santuario: {
                title: "Capítulo 2: El Enigma del Santuario",
                text: "Guiadas por el mapa, llegan frente a un antiguo arco de piedra cubierto de runas brillantes. La puerta tiene huecos con forma de flor y Kitty mira a Bri con atención.",
                image: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80",
                choices: [
                    { text: "Opción A: Colocar tulipanes azules reales en los huecos", next: "postre" },
                    { text: "Opción B: Pedirle a Kitty que active la runa secreta con su patita", next: "postre" }
                ]
            },
            postre: {
                title: "Capítulo 3: El Claro del Postre Mágico",
                text: "¡La puerta se abre y revela un claro secreto! Sobre un altar de piedra iluminado descansa un brillante y delicioso cheesecake de maracuyá fresco. Bri lo señala emocionada y Kitty da saltitos de alegría.",
                image: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=1200&q=80",
                choices: [
                    { text: "Compartir el primer trozo con Kitty y avanzar hacia la costa", next: "playa" }
                ]
            },
            playa: {
                title: "Capítulo 4: El Atardecer en la Playa",
                text: "El camino final las lleva a una hermosa costa dorada al atardecer. Bri se sienta cómodamente en la arena con Kitty acurrucada en su regazo, contemplando las olas. ¡Gracias por hacer cada día una aventura mágica!",
                image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80",
                choices: [
                    { text: "Volver a empezar la aventura", next: "inicio" }
                ]
            }
        };

        function showScene(sceneKey) {
            const scene = storyData[sceneKey];
            document.getElementById("story-title").innerText = scene.title;
            document.getElementById("story-text").innerText = scene.text;
            document.getElementById("story-image").src = scene.image;

            const choicesContainer = document.getElementById("choices-container");
            choicesContainer.innerHTML = "";

            scene.choices.forEach(choice => {
                const button = document.createElement("button");
                button.innerText = choice.text;
                if(sceneKey === 'playa') {
                    button.classList.add('restart-btn');
                }
                button.onclick = () => showScene(choice.next);
                choicesContainer.appendChild(button);
            });
        }

        showScene("inicio");
    </script>
</body>
</html>
