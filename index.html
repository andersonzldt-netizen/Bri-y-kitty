<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videojuego: La Aventura de Bri y Kitty</title>
    <style>
        :root {
            --bg-color: #090d16;
            --player-bg: #111827;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --hud-bg: rgba(15, 23, 42, 0.92);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .game-container {
            width: 100%;
            max-width: 850px;
            background: var(--player-bg);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid #1e293b;
        }

        .game-screen {
            position: relative;
            width: 100%;
            height: 420px;
            background-color: #000;
            overflow: hidden;
        }

        .game-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .game-screen img.active {
            opacity: 1;
            z-index: 1;
        }

        .game-hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .game-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
        }

        .inventory-badge {
            background-color: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--accent-color);
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            backdrop-filter: blur(5px);
        }

        .game-dialogue-box {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--hud-bg);
            backdrop-filter: blur(10px);
            border-top: 2px solid rgba(56, 189, 248, 0.4);
            padding: 25px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .dialogue-text {
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0;
            color: #e2e8f0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95);
            font-weight: 500;
        }

        .choices-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 2px solid #475569;
            color: #f8fafc;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-weight: 700;
        }

        .choice-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.5);
        }

        .restart-btn {
            background: linear-gradient(135deg, rgba(22, 101, 52, 0.95) 0%, rgba(20, 83, 45, 0.95) 100%);
            border-color: #166534;
        }
        .restart-btn:hover {
            background: #22c55e;
            border-color: #22c55e;
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.5);
        }

        .game-footer {
            background-color: #060910;
            padding: 8px 20px;
            text-align: right;
            font-size: 0.75rem;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="game-screen">
            <div class="game-hud">
                <h2 id="hud-chapter" class="game-title">Capítulo 1</h2>
                <div id="hud-inventory" class="inventory-badge">🎒 Inventario: Vacío</div>
            </div>

            <img id="img-inicio" class="active" src="https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1200&q=80" alt="Capítulo 1">
            <img id="img-santuario" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80" alt="Capítulo 2">
            <img id="img-postre" src="https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=1200&q=80" alt="Capítulo 3">
            <img id="img-playa" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80" alt="Capítulo 4">

            <div class="game-dialogue-box">
                <p id="game-dialogue" class="dialogue-text">Cargando motor de juego...</p>
                <div id="choices-container" class="choices-grid"></div>
            </div>
        </div>

        <div class="game-footer">
            <span>Motor de Videojuego Interactivo • HTML5 / JS</span>
        </div>
    </div>

    <script>
        const gameData = {
            inicio: {
                chapter: "Capítulo 1: El Bosque de Tulipanes",
                dialogue: "Bri camina sonriendo por el sendero del bosque mágico con su cabello lacio, lentes modernos, chaqueta de cuero y Kitty a su lado. Un pergamino brillante aparece.",
                image: "img-inicio",
                inventory: "🎒 Inventario: Mapa Mágico",
                choices: [
                    { text: "👉 Examinar el pergamino y avanzar al Santuario", next: "santuario" }
                ]
            },
            santuario: {
                chapter: "Capítulo 2: El Enigma del Santuario",
                dialogue: "Llegan frente al antiguo arco de piedra con runas brillantes. La puerta gigante exige una elección. Kitty mira fijamente a Bri esperando una orden.",
                image: "img-santuario",
                inventory: "🎒 Inventario: Pista del Santuario",
                choices: [
                    { text: "✨ Opción A: Colocar tulipanes azules reales en los huecos", next: "postre" },
                    { text: "🐾 Opción B: Pedirle a Kitty que active la runa secreta", next: "postre" }
                ]
            },
            postre: {
                chapter: "Capítulo 3: El Claro del Postre Mágico",
                dialogue: "¡La puerta se abre con destellos! Sobre un altar de piedra iluminado descansa un brillante cheesecake de maracuyá fresco. Bri lo señala emocionada.",
                image: "img-postre",
                inventory: "🍰 Inventario: Cheesecake de Maracuyá",
                choices: [
                    { text: "🌊 Compartir con Kitty y avanzar hacia la costa final", next: "playa" }
                ]
            },
            playa: {
                chapter: "Capítulo 4: El Atardecer en la Playa",
                dialogue: "El viaje concluye frente al mar al atardecer. Bri descansa en la arena con Kitty en su regazo, disfrutando la brisa. ¡Aventura completada con éxito!",
                image: "img-playa",
                inventory: "🏆 Inventario: Aventura Completada",
                choices: [
                    { text: "🔄 Volver a jugar desde el inicio", next: "inicio", isRestart: true }
                ]
            }
        };

        function changeScene(sceneKey) {
            const scene = gameData[sceneKey];

            // Ocultar todas las imágenes y mostrar solo la activa
            document.querySelectorAll('.game-screen img').forEach(img => {
                img.classList.remove('active');
            });
            document.getElementById(scene.image).classList.add('active');

            // Actualizar interfaz HUD y texto
            document.getElementById("hud-chapter").innerText = scene.chapter;
            document.getElementById("hud-inventory").innerText = scene.inventory;
            document.getElementById("game-dialogue").innerText = scene.dialogue;

            // Renderizar botones de opciones
            const choicesContainer = document.getElementById("choices-container");
            choicesContainer.innerHTML = "";

            scene.choices.forEach(choice => {
                const button = document.createElement("button");
                button.className = "choice-btn";
                if(choice.isRestart) button.classList.add("restart-btn");
                button.innerText = choice.text;
                button.onclick = () => changeScene(choice.next);
                choicesContainer.appendChild(button);
            });
        }

        // Iniciar el videojuego
        changeScene("inicio");
    </script>
</body>
</html>
