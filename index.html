<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bri & Kitty - Bosque de Tulipanes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Contenedor del Video de Fondo */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Barra Superior */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .game-title {
            background: rgba(0, 0, 0, 0.6);
            color: #f3e5ab;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            border: 1px solid rgba(243, 229, 171, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .location {
            font-size: 0.85rem;
            color: #d1d1d1;
            margin-top: 4px;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(243, 229, 171, 0.3);
            color: #f3e5ab;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(243, 229, 171, 0.2);
        }

        /* Área Inferior */
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            z-index: 10;
            gap: 20px;
        }

        /* Estadísticas */
        .stats-box {
            background: rgba(0, 0, 0, 0.75);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(243, 229, 171, 0.3);
            width: 200px;
            margin-bottom: 10px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 0.9rem;
        }

        .progress-bar {
            flex-grow: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #f3e5ab;
            width: 50%;
            transition: width 0.3s ease;
        }

        /* Caja de Diálogo */
        .dialogue-box {
            background: rgba(20, 18, 15, 0.85);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 20px;
            flex-grow: 1;
            max-width: 550px;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .speaker-name {
            color: #f3e5ab;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 8px;
            font-style: italic;
        }

        .dialogue-text {
            color: #f9f6ee;
            font-size: 1rem;
            line-height: 1.5;
            min-height: 50px;
        }

        /* Opciones de Elección */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 320px;
            margin-bottom: 10px;
        }

        .choice-btn {
            background: rgba(20, 18, 15, 0.85);
            border: 1px solid #d4af37;
            color: #f3e5ab;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .choice-btn:hover {
            background: rgba(212, 175, 55, 0.25);
            border-color: #fff;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>

    <video class="video-background" autoplay muted loop playsinline>
        <source src="fondo_bri.mp4" type="video/mp4">
        Tu navegador no soporta videos HTML5.
    </video>

    <div class="game-container">
        <div class="top-bar">
            <div>
                <div class="game-title">
                    <span>Bri & Kitty 🐾</span>
                    <span style="font-size: 0.8rem; opacity: 0.8;">V3</span>
                </div>
                <div class="location" id="locationText">📍 Bosque de Tulipanes</div>
            </div>
            <div class="top-buttons">
                <button class="icon-btn" title="Pausa">⏸</button>
                <button class="icon-btn" title="Configuración">⚙</button>
                <button class="icon-btn" title="Historial">📖</button>
            </div>
        </div>

        <div class="bottom-section">
            <div class="stats-box">
                <div class="stat-row">
                    <span>🐾</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="affectionBar"></div>
                    </div>
                </div>
            </div>

            <div class="dialogue-box">
                <div class="speaker-name" id="speakerName">Bri</div>
                <div class="dialogue-text" id="dialogueText">Qué lugar tan increíble, Kitty... Parece sacado de un sueño. ¿Vamos a explorar un poco?</div>
            </div>

            <div class="choices-container" id="choicesContainer">
                <button class="choice-btn" onclick="selectChoice(1)">
                    <span>🌷</span> Seguir el sendero de tulipanes
                </button>
                <button class="choice-btn" onclick="selectChoice(2)">
                    <span>⛰</span> Subir hacia la colina
                </button>
                <button class="choice-btn" onclick="selectChoice(3)">
                    <span>✨</span> Buscar el claro mágico
                </button>
            </div>
        </div>
    </div>

    <script>
        let affection = 50;

        function updateAffection(amount) {
            affection = Math.max(0, Math.min(100, affection + amount));
            document.getElementById('affectionBar').style.width = affection + '%';
        }

        function selectChoice(option) {
            const speaker = document.getElementById('speakerName');
            const dialogue = document.getElementById('dialogueText');
            const choices = document.getElementById('choicesContainer');
            const location = document.getElementById('locationText');

            if (option === 1) {
                location.innerText = "📍 Sendero de Tulipanes Rojos";
                speaker.innerText = "Bri";
                dialogue.innerText = "¡Mira cuántos colores, Kitty! La gatita tricolor maúlla contenta y se frota contra ti.";
                updateAffection(10);
            } else if (option === 2) {
                location.innerText = "📍 Colina del Mirador";
                speaker.innerText = "Bri";
                dialogue.innerText = "Desde aquí arriba el castillo se ve majestuoso. Kitty observa con atención las torres lejanas.";
                updateAffection(5);
            } else if (option === 3) {
                location.innerText = "📍 Claro Mágico del Bosque";
                speaker.innerText = "Bri";
                dialogue.innerText = "Hay un brillo mágico flotando en el aire. ¡Kitty da un pequeño salto emocionada!";
                updateAffection(15);
            }

            choices.innerHTML = `
                <button class="choice-btn" onclick="resetGame()">
                    <span>🔄</span> Volver al inicio
                </button>
            `;
        }

        function resetGame() {
            location.reload();
        }
    </script>
</body>
</html>
